<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Seat</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background: #E5E5EA; display: flex; justify-content: center; min-height: 100vh; }
    .app { background: #F4F4F6; min-height: 100vh; width: 100%; max-width: 480px; display: flex; flex-direction: column; }

    /* TOPBAR */
    .topbar { background: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid #E5E5EA; position: sticky; top: 0; z-index: 10; }
    .back-btn, .more-btn { background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; outline: none; padding: 0; color: #000; font-size: 20px; }
    .topbar-title-container { background: #F1F3F4; padding: 6px 18px; border-radius: 20px; display: flex; align-items: center; justify-content: center; }
    .topbar-title { font-size: 14px; font-weight: 500; color: #333; }

    /* INFO BANNER */
    .info-banner { background: #E8F2FF; margin: 14px 16px 0; border-radius: 12px; padding: 14px 16px; font-size: 13.5px; color: #000; line-height: 1.45; }
    .info-banner a { color: #1A73E8; text-decoration: none; font-weight: 500; }

    /* BOOKING CARD */
    .bk-section { padding: 20px 16px 0; }
    .bk-title { font-size: 16px; font-weight: 700; color: #000; margin-bottom: 12px; }
    .booking-card { background: #fff; border: 1px solid #E5E5EA; border-radius: 14px; padding: 16px; }
    .bk-row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .bk-date { font-size: 14px; color: #7F7F7F; font-weight: 400; }
    .unavailable-badge { background: #FFEBEB; color: #FF4A4A; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 20px; border: none; }
    .booked-badge { background: #EAF9E9; color: #1C8B27; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 20px; border: none; }
    .bk-id { font-size: 16px; font-weight: 700; color: #000; margin-bottom: 12px; }
    .bk-loc { font-size: 14px; color: #222; line-height: 1.5; }
    .bk-time { font-size: 14px; color: #222; margin-top: 12px; display: block; }
    
    .time-editor { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
    .time-select { width: 100%; border: 1px solid #ccc; border-radius: 10px; padding: 10px 12px; font-size: 14px; outline: none; background: #fff; }
    .time-ok { width: fit-content; background: #1a73e8; color: #fff; border: none; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 500; }

    /* DATE TILES */
    .date-section { padding: 20px 16px 0; }
    .date-label { font-size: 16px; font-weight: 700; color: #000; margin-bottom: 12px; }
    .date-tiles-row { display: flex; gap: 12px; }
    .date-tile { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; border: 1px solid #E5E5EA; border-radius: 12px; padding: 12px; min-width: 82px; cursor: pointer; }
    .date-tile.active { background: #F5EAFF; border-color: #D6B2FF; }
    .date-tile .d-day { font-size: 13px; color: #000; font-weight: 400; margin-bottom: 6px; }
    .date-tile .d-num { font-size: 14px; font-weight: 500; color: #000; }

    /* CITY */
    .city-section { padding: 20px 16px 0; }
    .city-label { font-size: 16px; font-weight: 700; color: #000; margin-bottom: 4px; }
    .city-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #D1D1D6; cursor: pointer; }
    .city-val { font-size: 15px; font-weight: 400; color: #000; }

    /* DEVELOPMENT CENTER */
    .dc-section { padding: 20px 16px 0; }
    .dc-heading { font-size: 16px; font-weight: 700; color: #000; margin-bottom: 14px; }
    .dc-divider { height: 1px; background: #D1D1D6; }
    .dc-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; cursor: pointer; }
    .dc-name { font-size: 16px; font-weight: 400; color: #000; }
    .dc-name.open { color: #000; font-weight: 400; }
    .floors-wrap { padding: 4px 0 8px; }
    .floor-name { font-size: 14.5px; font-weight: 400; color: #111; padding: 12px 0 8px; }
    .slots-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
    .slots-row::-webkit-scrollbar { display: none; }
    .slot-card { flex-shrink: 0; background: #fff; border: 0.5px solid #e0e0e0; border-radius: 10px; padding: 14px 10px; min-width: 140px; text-align: center; box-shadow: 2px 2px 4px rgba(0,0,0,0.08); }
    .slot-time { font-size: 13px; font-weight: 400; color: #C0390B; margin-bottom: 6px; line-height: 1.3; }
    .slot-seats { font-size: 13px; font-weight: 400; color: #C0390B; }

    /* ALLOCATE BUTTON */
    .alloc-wrap { margin-top: auto; padding: 32px 16px; }
    .alloc-btn { width: 100%; background: #7A7A7A; color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 500; cursor: pointer; display: block; outline: none; text-align: center; }

    /* CITY MODAL */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: flex-end; }
    .modal-bg.open { display: flex; }
    .modal-sheet { background: #F2F2F2; border-radius: 20px 20px 0 0; padding: 14px 16px 20px; width: 100%; }
    .modal-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; position: relative; }
    .modal-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 500; color: #111; }
    .m-close { width: 36px; height: 36px; border-radius: 50%; background: #e0e0e0; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; outline: none; }
    .m-confirm { width: 36px; height: 36px; border-radius: 50%; background: #222; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; outline: none; }
    .city-opt { padding: 15px 8px; text-align: center; font-size: 16px; border-radius: 8px; cursor: pointer; color: #999; font-weight: 400; }
    .city-opt.sel { background: #e4e4e4; color: #111; font-weight: 500; }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="back-btn"><i class="ti ti-arrow-left"></i></button>
    <div class="topbar-title-container">
      <span class="topbar-title">Book Seat for Time Slots</span>
    </div>
    <button class="more-btn"><i class="ti ti-dots-vertical"></i></button>
  </div>

  <div class="info-banner">
    <a href="#">Click Here</a> to view the cities/DCs where only full-day seat booking is enabled.
  </div>

  <div class="bk-section">
    <div class="bk-title">Booking Updates</div>
    <div class="booking-card">
      <div class="bk-row1">
        <span class="bk-date" id="bk-date">26-Aug-2025</span>
        <span id="status-badge" class="unavailable-badge">Unavailable</span>
      </div>
      <div class="bk-id">GURST 02 03 A 001</div>
      <div class="bk-loc">Gurgaon, Infosys Limited Gurgaon STP Unit, GGNUT, FLOOR-3, A</div>
      <span id="bk-time" class="bk-time">08:00AM - 08:00PM</span>
      <div class="time-editor" id="time-editor">
        <select id="time-select" class="time-select">
          <option value="08:00AM - 11:45AM">08:00AM - 11:45AM</option>
          <option value="12:00PM - 03:45PM">12:00PM - 03:45PM</option>
          <option value="04:00PM - 07:45PM">04:00PM - 07:45PM</option>
          <option value="08:00AM - 08:00PM">08:00AM - 08:00PM</option>
        </select>
        <button class="time-ok" id="time-ok">OK</button>
      </div>
    </div>
  </div>

  <div class="date-section">
    <div class="date-label">Date</div>
    <div class="date-tiles-row" id="date-tiles"></div>
  </div>

  <div class="city-section">
    <div class="city-label">City</div>
    <div class="city-row" onclick="openCityModal()">
      <span class="city-val" id="city-disp">Gurgaon</span>
      <span style="color:#B0B0B5; font-size:16px;"><i class="ti ti-chevron-down"></i></span>
    </div>
  </div>

  <div class="dc-section">
    <div class="dc-heading">Development Center</div>
    <div class="dc-divider"></div>
    <div id="dc-list"></div>
  </div>

  <div class="alloc-wrap">
    <button class="alloc-btn">Get System Allocated Seat</button>
  </div>
</div>

<div class="modal-bg" id="city-modal" onclick="cityBgClick(event)">
  <div class="modal-sheet">
    <div class="modal-hdr">
      <button class="m-close" onclick="closeCityModal()"><i class="ti ti-x" style="font-size:17px"></i></button>
      <span class="modal-title">City</span>
      <button class="m-confirm" onclick="confirmCity()"><i class="ti ti-check" style="font-size:17px"></i></button>
    </div>
    <div id="city-list"></div>
  </div>
</div>

<script>
  const DATA = {
    Gurgaon: {
      dcs: {
        'GURGAON-STP1': {
          floors: [
            { name: 'GGNUT, FLOOR-4, A', slots: ['08:00AM - 11:45AM', '12:00PM - 03:45PM', '04:00PM - 07:45PM', '08:00AM - 08:00PM'] },
            { name: 'GGNUT, FLOOR-5, A', slots: ['08:00AM - 11:45AM', '12:00PM - 03:45PM', '04:00PM - 07:45PM', '08:00AM - 08:00PM'] },
            { name: 'GGNUT, FLOOR-3, A', slots: ['08:00AM - 11:45AM', '12:00PM - 03:45PM', '04:00PM - 07:45PM', '08:00AM - 08:00PM'] }
          ]
        }
      }
    },
    Noida: {
      dcs: {
        'NOIDA-STP': {
          floors: [
            { name: 'ACECAPITOL, FLOOR-10, C', slots: ['08:00AM - 02:00PM', '02:00PM - 08:00PM'] },
            { name: 'ACECAPITOL, FLOOR-10, A', slots: ['08:00AM - 02:00PM', '02:00PM - 08:00PM'] },
            { name: 'BHUT01, FLOOR-16, A',     slots: ['08:00AM - 02:00PM', '02:00PM - 08:00PM'] }
          ]
        }
      }
    }
  };

  const CITIES  = ['Gurgaon', 'Kolkata', 'Noida'];
  const DAYS    = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const MONTHS  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const BOOKING_TIME_OPTIONS = ['08:00AM - 08:00PM', '08:00AM - 11:45AM', '12:00PM - 03:45PM', '04:00PM - 07:45PM'];

  let city = 'Gurgaon', pendingCity = 'Gurgaon', openDC = null, shownDates = [], currentDate = new Date(), selectedBookingTime = BOOKING_TIME_OPTIONS[0];

  async function getCurrentDateFromAPI() {
    try {
      const res = await fetch('https://worldtimeapi.org/api/ip');
      if (!res.ok) throw new Error('Time API failed');
      const data = await res.json();
      return new Date(data.datetime);
    } catch (err) {
      return new Date();
    }
  }

  function fmtCardDate(d) {
    return String(d.getDate()).padStart(2,'0') + '-' + MONTHS[d.getMonth()] + '-' + d.getFullYear();
  }
  function fmtTileNum(d) {
    return String(d.getDate()).padStart(2,'0') + ' ' + MONTHS[d.getMonth()];
  }
  function isPast(d) {
    const today = new Date(currentDate);
    today.setHours(0,0,0,0);
    const cmp   = new Date(d); cmp.setHours(0,0,0,0);
    return cmp < today;
  }

  function getDateForTargetWeekday(targetDay, baseDate) {
    const date = new Date(baseDate);
    const currentDay = baseDate.getDay();
    const diff = targetDay - currentDay;

    if (diff >= 0) {
      date.setDate(baseDate.getDate() + diff);
      return date;
    }

    if (currentDay === 5 && targetDay === 1) {
      date.setDate(baseDate.getDate() + (7 - currentDay) + targetDay);
      return date;
    }

    date.setDate(baseDate.getDate() + diff);
    return date;
  }

  function buildDateTiles() {
    const today = new Date(currentDate);
    const dow   = today.getDay();
    const displayRules = {
      1: [1, 2],
      2: [2, 3],
      3: [3, 4],
      4: [4, 5],
      5: [5, 6]
    };

    const weekdays = displayRules[dow] || [1, 2];
    shownDates = weekdays.map(day => getDateForTargetWeekday(day, today));

    const container = document.getElementById('date-tiles');
    container.innerHTML = '';
    shownDates.forEach((d, i) => {
      const tile = document.createElement('div');
      tile.className = 'date-tile';
      tile.innerHTML = `<span class="d-day">${DAYS[d.getDay() - 1]}</span><span class="d-num">${fmtTileNum(d)}</span>`;
      tile.onclick = () => selectDate(i);
      container.appendChild(tile);
    });

    const activeIndex = shownDates.findIndex(d => !isPast(d));
    selectDate(activeIndex >= 0 ? activeIndex : 0);
  }

  function selectDate(idx) {
    document.querySelectorAll('.date-tile').forEach((t, i) => {
      t.className = 'date-tile' + (i === idx ? ' active' : '');
    });
    updateBookingCard(shownDates[idx]);
  }

  function updateBookingCard(d) {
    document.getElementById('bk-date').textContent = fmtCardDate(d);
    document.getElementById('bk-time').textContent = selectedBookingTime;
    const badge     = document.getElementById('status-badge');
    if (isPast(d)) {
      badge.className   = 'unavailable-badge';
      badge.textContent = 'Unavailable';
    } else {
      badge.className   = 'unavailable-badge'; // Standard matching screenshot view
      badge.textContent = 'Unavailable';
    }
  }

  function setBookingTime(time) {
    selectedBookingTime = time;
    document.getElementById('bk-time').textContent = time;
  }

  function showTimeEditor() {
    const editor = document.getElementById('time-editor');
    const select = document.getElementById('time-select');
    select.value = selectedBookingTime;
    editor.style.display = 'flex';
  }

  function hideTimeEditor() {
    document.getElementById('time-editor').style.display = 'none';
  }

  function attachTimeEditorEvents() {
    const timeLabel = document.getElementById('bk-time');
    const okBtn = document.getElementById('time-ok');
    const select = document.getElementById('time-select');
    timeLabel.ondblclick = showTimeEditor;
    okBtn.onclick = () => {
      setBookingTime(select.value);
      hideTimeEditor();
    };
  }

  function renderDC() {
    const el  = document.getElementById('dc-list');
    el.innerHTML = '';
    const dcs = DATA[city] ? DATA[city].dcs : {};
    Object.entries(dcs).forEach(([dc, data]) => {
      const isOpen = openDC === dc;
      const wrap   = document.createElement('div');
      let floorsHTML = '';
      if (isOpen) {
        floorsHTML = '<div class="floors-wrap">' + data.floors.map(f => `
          <div class="floor-name">${f.name}</div>
          <div class="slots-row">${f.slots.map(s => `
            <div class="slot-card">
              <div class="slot-time">${s}</div>
              <div class="slot-seats">0 Seat(s)</div>
            </div>`).join('')}
          </div>`).join('') + '</div>';
      }
      wrap.innerHTML = `
        <div class="dc-row" onclick="toggleDC('${dc}')">
          <span class="dc-name${isOpen ? ' open' : ''}">${dc}</span>
          <i class="ti ${isOpen ? 'ti-chevron-up' : 'ti-chevron-down'}" style="font-size:20px; color:#000; font-weight:700;"></i>
        </div>
        ${floorsHTML}
        <div class="dc-divider"></div>`;
      el.appendChild(wrap);
    });
  }

  function toggleDC(n) { openDC = openDC === n ? null : n; renderDC(); }

  function openCityModal() {
    pendingCity = city;
    document.getElementById('city-list').innerHTML = CITIES.map(c =>
      `<div class="city-opt${c === pendingCity ? ' sel' : ''}" onclick="pickCity('${c}')">${c}</div>`
    ).join('');
    document.getElementById('city-modal').classList.add('open');
  }
  function pickCity(c) {
    pendingCity = c;
    document.querySelectorAll('.city-opt').forEach(el => el.classList.toggle('sel', el.textContent.trim() === c));
  }
  function confirmCity() {
    city = pendingCity;
    document.getElementById('city-disp').textContent = city;
    openDC = null;
    closeCityModal();
    renderDC();
  }
  function closeCityModal() { document.getElementById('city-modal').classList.remove('open'); }
  function cityBgClick(e)   { if (e.target === document.getElementById('city-modal')) closeCityModal(); }

  async function init() {
    currentDate = await getCurrentDateFromAPI();
    buildDateTiles();
    renderDC();
    attachTimeEditorEvents();
  }

  init();
</script>
</body>
</html>
